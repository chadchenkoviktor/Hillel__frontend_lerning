<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <form action="sabmit" method="post" class="form">
        <h1><a href="#">Login</a> | <a href="#">Register</a></h1>
        <h2>Enter your email and password to register.</h2>
        <p>
            <label>
                Name
            <input type="text" placeholder="Username" required>
            </label>
        </p>
        <p>
            <label>
                Email
            <input type="text" placeholder="Enter your email address">
            </label>
        </p>
        <p>
            <label>
                Password
                <input type="password" placeholder="Password" required>
            </label>
        </p>
        <p>
            <label>
                Confirm Password
                <input type="password" placeholder="Confirm Password" required>
            </label>
        </p>
        
        <button type="reset">Очистить форму</button>
        <button type="submit">Register</button>
        
        <div>
            <hr><span>Or register with</span><hr>
        </div>
        <p>
            <button><a href="">Continue with Google</a></button><br>
        </p>
        <p>
            <button><a href="">Continue with Facebook</a></button>
        </p>
    </form>
    
</body>
</html>
